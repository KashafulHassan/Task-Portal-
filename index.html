<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Internship Task Portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0b0b1a;
    --surface: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.14);
    --text: #eef0fa;
    --muted: #a8accf;
    --purple: #8b5cf6;
    --blue: #3b82f6;
    --silver: #cfd4e8;
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
  }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    position: relative;
    overflow-x: hidden;
  }
  /* Metallic wave background inspired by the reference image */
  .waves {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(160deg, #0b0b1a 0%, #141230 45%, #0d1b3e 100%);
  }
  .waves svg { position: absolute; bottom: 0; left: 0; width: 100%; height: 55vh; opacity: 0.9; }

  header {
    padding: 28px clamp(16px, 4vw, 48px) 8px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    display: grid; place-items: center;
    box-shadow: 0 0 18px rgba(139, 92, 246, 0.55);
    font-weight: 700; font-size: 18px; color: #fff;
  }
  .brand h1 { font-size: 1.15rem; letter-spacing: 0.3px; }
  .brand p { font-size: 0.8rem; color: var(--muted); }
  .intern-chip {
    padding: 8px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 0.8rem; color: var(--silver); backdrop-filter: blur(8px);
  }

  .layout { padding: 12px clamp(16px, 4vw, 48px) 64px; max-width: 1200px; margin: 0 auto; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0 20px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; backdrop-filter: blur(10px);
  }
  .stat .num { font-size: 1.5rem; font-weight: 700; }
  .stat .lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
  .stat.purple .num { color: #b79cff; }
  .stat.blue .num { color: #7cb3ff; }
  .stat.green .num { color: #6ee7b7; }

  /* Controls */
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 20px; backdrop-filter: blur(10px);
  }
  .controls label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 4px; }
  select, input, textarea {
    background: rgba(11, 11, 26, 0.7); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; font-size: 0.85rem; outline: none; width: 100%;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  select:focus, input:focus, textarea:focus {
    border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
  }
  .controls .field { min-width: 150px; flex: 1; }
  .controls .search { flex: 2; min-width: 200px; }
  .btn {
    border: none; cursor: pointer; border-radius: 10px; padding: 10px 18px;
    font-size: 0.85rem; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(99, 102, 241, 0.55); }
  .btn.ghost { background: transparent; border: 1px solid var(--border); box-shadow: none; color: var(--silver); }

  /* Task grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px; backdrop-filter: blur(12px);
    display: flex; flex-direction: column; gap: 12px;
    transition: transform 0.15s, border-color 0.15s;
  }
  .card:hover { transform: translateY(-2px); border-color: rgba(139, 92, 246, 0.5); }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .badge {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    padding: 4px 10px; border-radius: 999px; border: 1px solid transparent;
  }
  .badge.high { background: rgba(239, 68, 68, 0.16); color: #fca5a5; border-color: rgba(239, 68, 68, 0.35); }
  .badge.medium { background: rgba(234, 179, 8, 0.14); color: #fde68a; border-color: rgba(234, 179, 8, 0.32); }
  .badge.low { background: rgba(16, 185, 129, 0.14); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.32); }
  .badge.pending { background: rgba(148, 163, 184, 0.16); color: #cbd5e1; border-color: rgba(148, 163, 184, 0.35); }
  .badge.progress { background: rgba(59, 130, 246, 0.16); color: #93c5fd; border-color: rgba(59, 130, 246, 0.35); }
  .badge.completed { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.35); }
  .card h3 { font-size: 1rem; line-height: 1.35; }
  .card .desc { font-size: 0.83rem; color: var(--muted); line-height: 1.5; flex: 1; }
  .card .meta { font-size: 0.75rem; color: var(--silver); display: flex; align-items: center; gap: 6px; }
  .card .meta .overdue { color: #fca5a5; font-weight: 600; }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .status-btn {
    flex: 1; min-width: 92px; cursor: pointer; font-size: 0.75rem; font-weight: 600;
    padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border);
    background: rgba(11, 11, 26, 0.5); color: var(--silver); transition: all 0.15s;
  }
  .status-btn.active { background: linear-gradient(135deg, var(--purple), var(--blue)); color: #fff; border-color: transparent; }
  .status-btn:not(.active):hover { border-color: var(--purple); color: #fff; }

  /* Add task form */
  details.form-panel { margin-top: 28px; }
  summary {
    cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 0.9rem; color: var(--silver);
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 18px; backdrop-filter: blur(10px);
  }
  summary::-webkit-details-marker { display: none; }
  .form {
    margin-top: 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; backdrop-filter: blur(12px);
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;
  }
  .form .full { grid-column: 1 / -1; }
  .form .error { color: #fca5a5; font-size: 0.72rem; margin-top: 5px; min-height: 14px; }
  .form .actions { grid-column: 1 / -1; display: flex; gap: 10px; }
  input.invalid, textarea.invalid, select.invalid { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18); }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 0.9rem; }
  footer { text-align: center; color: var(--muted); font-size: 0.72rem; padding: 20px; }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .controls { flex-direction: column; align-items: stretch; }
    .controls .field, .controls .search { min-width: unset; }
  }
</style>
</head>
<body>
<div class="waves">
  <svg viewBox="0 0 1440 600" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="w1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.15"/>
      </linearGradient>
      <linearGradient id="w2" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#cfd4e8" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      </linearGradient>
      <linearGradient id="w3" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#cfd4e8" stop-opacity="0.08"/>
      </linearGradient>
    </defs>
    <path fill="url(#w3)" d="M0,320 C240,160 480,440 720,340 C960,240 1200,420 1440,300 L1440,600 L0,600 Z"/>
    <path fill="url(#w1)" d="M0,420 C260,260 520,540 780,440 C1020,350 1240,520 1440,420 L1440,600 L0,600 Z"/>
    <path fill="url(#w2)" d="M0,520 C300,380 600,600 900,500 C1120,430 1300,560 1440,500 L1440,600 L0,600 Z"/>
  </svg>
</div>

<header>
  <div class="brand">
    <div class="logo">IT</div>
    <div>
      <h1>Internship Task Portal</h1>
      <p>Track your assigned tasks and progress</p>
    </div>
  </div>
  <div class="intern-chip">👤 Intern: Kashaf ul</div>
</header>

<main class="layout">
  <section class="stats" id="stats"></section>

  <section class="controls" aria-label="Task filters">
    <div class="field">
      <label for="filterStatus">Status</label>
      <select id="filterStatus">
        <option value="all">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>
    </div>
    <div class="field">
      <label for="filterPriority">Priority</label>
      <select id="filterPriority">
        <option value="all">All Priorities</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>
    <div class="search">
      <label for="search">Search</label>
      <input id="search" type="text" placeholder="Search by title or description…" />
    </div>
    <div class="field" style="max-width:130px">
      <label>&nbsp;</label>
      <button class="btn ghost" id="resetFilters" type="button">Reset</button>
    </div>
  </section>

  <section class="grid" id="taskGrid" aria-label="Task list"></section>

  <details class="form-panel">
    <summary>＋ Add a new task</summary>
    <form class="form" id="addForm" novalidate>
      <div>
        <label for="fTitle">Title *</label>
        <input id="fTitle" type="text" placeholder="e.g. Build landing page" maxlength="80" />
        <div class="error" id="errTitle"></div>
      </div>
      <div>
        <label for="fPriority">Priority *</label>
        <select id="fPriority">
          <option value="">Select priority</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
        <div class="error" id="errPriority"></div>
      </div>
      <div>
        <label for="fDeadline">Deadline *</label>
        <input id="fDeadline" type="date" />
        <div class="error" id="errDeadline"></div>
      </div>
      <div class="full">
        <label for="fDesc">Description</label>
        <textarea id="fDesc" rows="3" placeholder="Describe the task…" maxlength="300"></textarea>
        <div class="error" id="errDesc"></div>
      </div>
      <div class="actions">
        <button class="btn" type="submit">Add Task</button>
        <button class="btn ghost" type="reset" id="clearForm">Clear</button>
      </div>
    </form>
  </details>
</main>

<footer>Internship Task Portal · Mock data only · Built as a Web Developer intern task</footer>

<script>
  // ---- Mock data (localStorage persistence optional) ----
  const STORAGE_KEY = "itp_tasks_v1";
  const seed = [
    { id: 1, title: "Build responsive landing page", desc: "Create a mobile-first landing page for the product using HTML, CSS and minimal JS. Must pass basic accessibility checks.", priority: "High", deadline: "2026-10-24", status: "In Progress" },
    { id: 2, title: "Fix navigation bar overflow bug", desc: "Navbar overflows horizontally on screens below 360px. Reproduce, fix, and verify on small viewports.", priority: "High", deadline: "2026-10-21", status: "Pending" },
    { id: 3, title: "Write API integration docs", desc: "Document the mock API endpoints, expected request/response shapes, and error codes for the team wiki.", priority: "Medium", deadline: "2026-10-28", status: "Pending" },
    { id: 4, title: "Style the contact form", desc: "Apply the new design system tokens to the contact form: inputs, focus rings, validation states.", priority: "Low", deadline: "2026-11-02", status: "Pending" },
    { id: 5, title: "Set up repo and CI linting", desc: "Initialize the project repository with ESLint, Prettier and a simple CI pipeline for lint checks.", priority: "Medium", deadline: "2026-10-15", status: "Completed" },
    { id: 6, title: "Optimize hero images", desc: "Compress hero images to WebP and add lazy loading. Target: LCP under 2.5s on 4G.", priority: "Low", deadline: "2026-10-19", status: "In Progress" }
  ];
  let tasks;
  try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || seed.slice(); }
  catch { tasks = seed.slice(); }
  const save = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch {} };

  const STATUSES = ["Pending", "In Progress", "Completed"];
  const statusClass = s => s === "Pending" ? "pending" : s === "In Progress" ? "progress" : "completed";

  // ---- Validation helpers ----
  const isOverdue = t => t.status !== "Completed" && new Date(t.deadline) < new Date(new Date().toDateString());
  const fmtDate = d => new Date(d + "T00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---- Stats ----
  function renderStats(list) {
    const counts = { Pending: 0, "In Progress": 0, Completed: 0 };
    list.forEach(t => counts[t.status]++);
    document.getElementById("stats").innerHTML = `
      <div class="stat purple"><div class="num">${list.length}</div><div class="lbl">Total Tasks</div></div>
      <div class="stat"><div class="num">${counts.Pending}</div><div class="lbl">Pending</div></div>
      <div class="stat blue"><div class="num">${counts["In Progress"]}</div><div class="lbl">In Progress</div></div>
      <div class="stat green"><div class="num">${counts.Completed}</div><div class="lbl">Completed</div></div>`;
  }

  // ---- Task cards ----
  function taskCard(t) {
    const prio = t.priority.toLowerCase();
    const overdue = isOverdue(t);
    return `
    <article class="card" data-id="${t.id}">
      <div class="card-top">
        <span class="badge ${prio}">${t.priority}</span>
        <span class="badge ${statusClass(t.status)}">${t.status}</span>
      </div>
      <h3>${esc(t.title)}</h3>
      <p class="desc">${esc(t.desc || "No description provided.")}</p>
      <div class="meta">📅 Deadline: ${fmtDate(t.deadline)}${overdue ? ' <span class="overdue">· Overdue</span>' : ""}</div>
      <div class="card-actions">
        ${STATUSES.map(s =>
          `<button class="status-btn ${s === t.status ? "active" : ""}" data-set="${s}">${s}</button>`
        ).join("")}
      </div>
    </article>`;
  }

  function render() {
    const fs = document.getElementById("filterStatus").value;
    const fp = document.getElementById("filterPriority").value;
    const q = document.getElementById("search").value.trim().toLowerCase();

    let list = tasks.filter(t =>
      (fs === "all" || t.status === fs) &&
      (fp === "all" || t.priority === fp) &&
      (!q || (t.title + " " + (t.desc || "")).toLowerCase().includes(q))
    );
    const order = { High: 0, Medium: 1, Low: 2 };
    list.sort((a, b) => order[a.priority] - order[b.priority] || new Date(a.deadline) - new Date(b.deadline));

    renderStats(tasks);
    document.getElementById("taskGrid").innerHTML = list.length
      ? list.map(taskCard).join("")
      : `<div class="empty">No tasks match the current filters.</div>`;
    save();
  }

  // ---- Status change (event delegation) ----
  document.getElementById("taskGrid").addEventListener("click", e => {
    const btn = e.target.closest(".status-btn");
    if (!btn) return;
    const id = +btn.closest(".card").dataset.id;
    const t = tasks.find(t => t.id === id);
    if (t && t.status !== btn.dataset.set) { t.status = btn.dataset.set; render(); }
  });

  // ---- Filters ----
  ["filterStatus", "filterPriority", "search"].forEach(id =>
    document.getElementById(id).addEventListener("input", render)
  );
  document.getElementById("resetFilters").addEventListener("click", () => {
    document.getElementById("filterStatus").value = "all";
    document.getElementById("filterPriority").value = "all";
    document.getElementById("search").value = "";
    render();
  });

  // ---- Add task form with validation ----
  const form = document.getElementById("addForm");
  const fields = {
    fTitle:  { err: "errTitle",  validate: v => v.length >= 5 ? "" : "Title must be at least 5 characters." },
    fPriority: { err: "errPriority", validate: v => ["High", "Medium", "Low"].includes(v) ? "" : "Please select a priority." },
    fDeadline: { err: "errDeadline", validate: v => {
        if (!v) return "Deadline is required.";
        const d = new Date(v + "T00:00");
        if (isNaN(d)) return "Enter a valid date.";
        if (d < new Date(new Date().toDateString())) return "Deadline cannot be in the past.";
        return "";
      } },
    fDesc:  { err: "errDesc", validate: v => v.length <= 300 ? "" : "Description is too long." }
  };

  function validateField(input) {
    const rule = fields[input.id];
    const msg = rule.validate(input.value.trim());
    document.getElementById(rule.err).textContent = msg;
    input.classList.toggle("invalid", !!msg);
    return !msg;
  }

  Object.keys(fields).forEach(id => {
    const input = document.getElementById(id);
    input.addEventListener("blur", () => validateField(input));
    input.addEventListener("input", () => { if (input.classList.contains("invalid")) validateField(input); });
  });

  form.addEventListener("submit", e => {
    e.preventDefault();
    const inputs = Object.keys(fields).map(id => document.getElementById(id));
    const ok = inputs.map(validateField).every(Boolean);
    if (!ok) { inputs.find(i => i.classList.contains("invalid"))?.focus(); return; }
    tasks.unshift({
      id: Date.now(),
      title: document.getElementById("fTitle").value.trim(),
      desc: document.getElementById("fDesc").value.trim(),
      priority: document.getElementById("fPriority").value,
      deadline: document.getElementById("fDeadline").value,
      status: "Pending"
    });
    form.reset();
    document.querySelectorAll(".error").forEach(el => el.textContent = "");
    render();
  });

  form.addEventListener("reset", () => {
    document.querySelectorAll(".error").forEach(el => el.textContent = "");
    form.querySelectorAll(".invalid").forEach(el => el.classList.remove("invalid"));
  });

  render();
</script>
</body>
</html>
